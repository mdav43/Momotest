---
layout: default
---
<article class="page">
  {%- if page.eyebrow -%}
    <p class="eyebrow">{{ page.eyebrow }}</p>
  {%- endif -%}
  <h1 class="page__title">{{ page.title }}</h1>
  {%- if page.lede -%}
    <p class="lede">{{ page.lede }}</p>
  {%- endif -%}
  <div class="prose">
    {{ content }}
  </div>
</article>
