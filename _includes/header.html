<header class="site-header" role="banner">
  <div class="container site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="MonetaGo home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28" focusable="false"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 20 L16 10 L23 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand__name">MonetaGo</span>
    </a>

    <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">
      <span class="visually-hidden">Menu</span>
      <span class="nav-toggle__bars" aria-hidden="true"></span>
    </button>

    <nav id="primary-nav" class="primary-nav" aria-label="Primary">
      <ul>
        {%- for item in site.data.nav.primary -%}
          <li class="primary-nav__item{% if item.children %} has-children{% endif %}">
            <a href="{{ item.url | relative_url }}"{% if page.url contains item.url and item.url != '/' %} aria-current="page"{% endif %}>{{ item.label }}</a>
            {%- if item.children -%}
              <ul class="primary-nav__sub">
                {%- for child in item.children -%}
                  <li><a href="{{ child.url | relative_url }}">{{ child.label }}</a></li>
                {%- endfor -%}
              </ul>
            {%- endif -%}
          </li>
        {%- endfor -%}
        <li class="primary-nav__cta">
          <a class="btn btn--primary" href="mailto:{{ site.contact.email }}">Talk to us</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
